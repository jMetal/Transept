[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transept"
version = "0.1.0.dev0"
description = "Graphical interface of Transept, multiobjective structure-guided alignment of transmembrane proteins"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.67",
    "numpy",
    "biopython",
    "pandas",
    "plotly",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["transept*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
