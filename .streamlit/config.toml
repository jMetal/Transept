# Transept is meant for local use: it has no authentication and launches processes, so it only
# listens on this machine.
[server]
address = "localhost"

[browser]
gatherUsageStats = false

[client]
# Hide the developer options (Deploy, Rerun settings) from the toolbar.
toolbarMode = "viewer"

# The look of Transept: the warm colours of its logo (aubergine ink, terracotta and saffron, as
# the lipids of a membrane) and its typefaces
# (Space Grotesk for headings, Inter for text, JetBrains Mono for sequences and commands).
[theme]
base = "light"
primaryColor = "#A9432A"
backgroundColor = "#FBF8F4"
secondaryBackgroundColor = "#F3ECE5"
textColor = "#2D1E3B"
linkColor = "#A9432A"
borderColor = "#E6DDD3"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap, monospace"
headingFontWeights = [700, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#A9432A", "#E0A21B", "#2D1E3B", "#5E8C7A", "#7A5C9E", "#C9A79A", "#6B4A1A", "#F6E2D8"]

